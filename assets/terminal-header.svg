<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <style>
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 14px;
    }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes fadeIn1 {
      0% { opacity: 0; }
      10%, 100% { opacity: 1; }
    }
    @keyframes fadeIn2 {
      0%, 15% { opacity: 0; }
      25%, 100% { opacity: 1; }
    }
    @keyframes fadeIn3 {
      0%, 35% { opacity: 0; }
      45%, 100% { opacity: 1; }
    }
    @keyframes fadeIn4 {
      0%, 55% { opacity: 0; }
      65%, 100% { opacity: 1; }
    }
    @keyframes fadeIn5 {
      0%, 75% { opacity: 0; }
      85%, 100% { opacity: 1; }
    }

    .l1 { animation: fadeIn1 12s infinite; }
    .l2 { animation: fadeIn2 12s infinite; }
    .l3 { animation: fadeIn3 12s infinite; }
    .l4 { animation: fadeIn4 12s infinite; }
    .l5 { animation: fadeIn5 12s infinite; }
    .cursor { animation: blink 0.8s infinite; }
  </style>

  <!-- Outer Window Frame -->
  <rect x="2" y="2" width="796" height="316" rx="12" fill="url(#borderGradient)" stroke="none" />
  <rect x="4" y="4" width="792" height="312" rx="10" fill="url(#terminalBg)" />

  <!-- Terminal Top Header Bar -->
  <path d="M 4 14 C 4 8.48 8.48 4 14 4 L 786 4 C 791.52 4 796 8.48 796 14 L 796 44 L 4 44 Z" fill="url(#headerGradient)" />
  <line x1="4" y1="44" x2="796" y2="44" stroke="#334155" stroke-width="1" />

  <!-- Window Control Buttons (macOS 🔴 🟡 🟢) -->
  <circle cx="28" cy="24" r="6" fill="#ef4444" />
  <circle cx="48" cy="24" r="6" fill="#f59e0b" />
  <circle cx="68" cy="24" r="6" fill="#10b981" />

  <!-- Window Header Title -->
  <text x="400" y="28" fill="#94a3b8" font-family="ui-monospace, monospace" font-size="12px" font-weight="600" text-anchor="middle">
    ⚡ yahia@neural-core: ~/projects/applied-ai (zsh)
  </text>

  <!-- LINE 1 (y = 85) -->
  <g class="l1">
    <text x="32" y="85" class="font-mono" fill="#38bdf8" font-weight="bold">❯</text>
    <text x="52" y="85" class="font-mono" fill="#a78bfa" font-weight="600">initialize</text>
    <text x="145" y="85" class="font-mono" fill="#38bdf8">--identity</text>
    <text x="240" y="85" class="font-mono" fill="#f1f5f9">"Yahia Bin Zaman"</text>
    <text x="405" y="85" class="font-mono" fill="#22c55e">--mode=production</text>
  </g>

  <!-- LINE 2 (y = 125) -->
  <g class="l2">
    <text x="32" y="125" class="font-mono" fill="#64748b">[SYSTEM]:</text>
    <text x="115" y="125" class="font-mono" fill="#38bdf8" font-weight="bold">Applied AI &amp; Full-Stack Software Engineer</text>
  </g>

  <!-- LINE 3 (y = 165) -->
  <g class="l3">
    <text x="32" y="165" class="font-mono" fill="#64748b">[MODULES]:</text>
    <text x="125" y="165" class="font-mono" fill="#22c55e">✔</text>
    <text x="145" y="165" class="font-mono" fill="#f8fafc">Autonomous AI Agents</text>
    <text x="330" y="165" class="font-mono" fill="#22c55e">✔</text>
    <text x="350" y="165" class="font-mono" fill="#f8fafc">Next.js / Full-Stack</text>
    <text x="535" y="165" class="font-mono" fill="#22c55e">✔</text>
    <text x="555" y="165" class="font-mono" fill="#f8fafc">Creative UI/UX</text>
  </g>

  <!-- LINE 4 (y = 205) -->
  <g class="l4">
    <text x="32" y="205" class="font-mono" fill="#64748b">[STATUS]:</text>
    <text x="110" y="205" class="font-mono" fill="#34d399" font-weight="600">● OPEN FOR ROLES &amp; CONSULTING</text>
    <text x="400" y="205" class="font-mono" fill="#818cf8">| Latency: 12ms</text>
    <text x="540" y="205" class="font-mono" fill="#f43f5e">| Precision: 100%</text>
  </g>

  <!-- LINE 5 (y = 250) -->
  <g class="l5">
    <text x="32" y="250" class="font-mono" fill="#38bdf8" font-weight="bold">❯</text>
    <text x="52" y="250" class="font-mono" fill="#f1f5f9">crafting_next_generation_ai_products</text>
    <rect x="400" y="236" width="9" height="17" fill="#38bdf8" class="cursor" />
  </g>

  <!-- Decorative Corner Dots -->
  <circle cx="760" cy="290" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="745" cy="290" r="3" fill="#818cf8" opacity="0.4"/>
  <circle cx="730" cy="290" r="3" fill="#c084fc" opacity="0.3"/>
</svg>
