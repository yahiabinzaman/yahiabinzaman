<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Linear Gradients -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#151e33"/>
      <stop offset="100%" stop-color="#0e1726"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes typeLine1 {
      0% { width: 0; }
      15% { width: 340px; }
      100% { width: 340px; }
    }
    @keyframes showLine2 {
      0%, 18% { opacity: 0; transform: translateY(4px); }
      22%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes showLine3 {
      0%, 36% { opacity: 0; transform: translateY(4px); }
      40%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes showLine4 {
      0%, 54% { opacity: 0; transform: translateY(4px); }
      58%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes showLine5 {
      0%, 72% { opacity: 0; transform: translateY(4px); }
      76%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes cursorFollow {
      0%, 75% { opacity: 0; }
      76%, 100% { opacity: 1; }
    }
    @keyframes pulseGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.4)); }
      50% { filter: drop-shadow(0 0 16px rgba(129, 140, 248, 0.7)); }
    }

    .terminal-box {
      animation: pulseGlow 6s infinite ease-in-out;
    }
    .mono-text {
      font-family: 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace;
      font-size: 14px;
    }
    .cursor {
      animation: blink 0.9s infinite;
    }
    .line-1 {
      overflow: hidden;
      white-space: nowrap;
      display: inline-block;
      animation: typeLine1 10s infinite;
    }
    .line-2 { animation: showLine2 10s infinite; }
    .line-3 { animation: showLine3 10s infinite; }
    .line-4 { animation: showLine4 10s infinite; }
    .line-5 { animation: showLine5 10s infinite; }
    .final-cursor { animation: cursorFollow 10s infinite, blink 0.9s infinite; }
  </style>

  <!-- Outer Window Container with Border Gradient -->
  <g class="terminal-box">
    <rect x="10" y="10" width="780" height="300" rx="14" fill="url(#borderGradient)" />
    <rect x="12" y="12" width="776" height="296" rx="12" fill="url(#terminalBg)" />
  </g>

  <!-- Window Header Bar -->
  <path d="M 12 24 C 12 17.37 17.37 12 24 12 L 776 12 C 782.63 12 788 17.37 788 24 L 788 48 L 12 48 Z" fill="url(#headerGradient)" />
  <line x1="12" y1="48" x2="788" y2="48" stroke="#1f2d47" stroke-width="1" />

  <!-- Mac Window Buttons (🔴 🟡 🟢) -->
  <circle cx="34" cy="30" r="6.5" fill="#ff5f56" />
  <circle cx="54" cy="30" r="6.5" fill="#ffbd2e" />
  <circle cx="74" cy="30" r="6.5" fill="#27c93f" />

  <!-- Terminal Title -->
  <g opacity="0.85">
    <text x="400" y="34" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12px" font-weight="500" text-anchor="middle">
      ⚡ yahia@neural-core: ~/projects/applied-ai-hub (zsh)
    </text>
  </g>

  <!-- Terminal Content Lines -->
  <g transform="translate(36, 80)">

    <!-- Line 1: Command Initiation -->
    <g>
      <text class="mono-text" fill="#38bdf8" font-weight="700">❯</text>
      <text x="20" y="0" class="mono-text" fill="#a78bfa" font-weight="600">initialize</text>
      <text x="110" y="0" class="mono-text" fill="#38bdf8">--identity</text>
      <text x="202" y="0" class="mono-text" fill="#f1f5f9">"Yahia Bin Zaman"</text>
      <text x="365" y="0" class="mono-text" fill="#22c55e">--mode=production</text>
    </g>

    <!-- Line 2: Output Identity -->
    <g class="line-2" transform="translate(0, 32)">
      <text class="mono-text" fill="#64748b">[SYSTEM]:</text>
      <text x="80" y="0" class="mono-text" fill="#38bdf8" font-weight="600">Applied AI &amp; Full-Stack Software Engineer</text>
    </g>

    <!-- Line 3: Capabilities -->
    <g class="line-3" transform="translate(0, 64)">
      <text class="mono-text" fill="#64748b">[MODULES]:</text>
      <text x="90" y="0" class="mono-text" fill="#22c55e">✔</text>
      <text x="108" y="0" class="mono-text" fill="#e2e8f0">Autonomous AI Agents</text>
      <text x="280" y="0" class="mono-text" fill="#22c55e">✔</text>
      <text x="298" y="0" class="mono-text" fill="#e2e8f0">Next.js / Full-Stack</text>
      <text x="470" y="0" class="mono-text" fill="#22c55e">✔</text>
      <text x="488" y="0" class="mono-text" fill="#e2e8f0">Creative UI/UX</text>
    </g>

    <!-- Line 4: Status Metrics -->
    <g class="line-4" transform="translate(0, 96)">
      <text class="mono-text" fill="#64748b">[STATUS]:</text>
      <text x="75" y="0" class="mono-text" fill="#34d399">● OPEN FOR ROLES &amp; CLIENT PROJECTS</text>
      <text x="390" y="0" class="mono-text" fill="#818cf8">| Latency: 12ms</text>
      <text x="525" y="0" class="mono-text" fill="#f43f5e">| Precision: 100%</text>
    </g>

    <!-- Line 5: Next Command Prompt with Active Blinking Cursor -->
    <g class="line-5" transform="translate(0, 134)">
      <text class="mono-text" fill="#38bdf8" font-weight="700">❯</text>
      <text x="20" y="0" class="mono-text" fill="#f1f5f9">crafting_next_generation_digital_products</text>
      <rect x="368" y="-12" width="9" height="16" fill="#38bdf8" class="final-cursor" />
    </g>

  </g>

  <!-- Bottom Accent Highlights -->
  <circle cx="760" cy="285" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="745" cy="285" r="3" fill="#818cf8" opacity="0.4"/>
  <circle cx="730" cy="285" r="3" fill="#c084fc" opacity="0.3"/>
</svg>
