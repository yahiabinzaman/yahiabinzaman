<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#172238"/>
      <stop offset="100%" stop-color="#0d1726"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .code {
      font-family: 'Fira Code', 'JetBrains Mono', 'SF Mono', Consolas, Monaco, monospace;
      font-size: 14px;
    }
    
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes step1 { 0% { opacity: 0; } 5%, 100% { opacity: 1; } }
    @keyframes step2 { 0%, 15% { opacity: 0; } 22%, 100% { opacity: 1; } }
    @keyframes step3 { 0%, 35% { opacity: 0; } 42%, 100% { opacity: 1; } }
    @keyframes step4 { 0%, 55% { opacity: 0; } 62%, 100% { opacity: 1; } }
    @keyframes step5 { 0%, 75% { opacity: 0; } 82%, 100% { opacity: 1; } }

    .line1 { animation: step1 10s infinite; }
    .line2 { animation: step2 10s infinite; }
    .line3 { animation: step3 10s infinite; }
    .line4 { animation: step4 10s infinite; }
    .line5 { animation: step5 10s infinite; }
    .cursor-blink { animation: blink 0.8s infinite; }
  </style>

  <!-- Outer Window Glow & Border -->
  <rect x="2" y="2" width="846" height="326" rx="14" fill="url(#borderGrad)" />
  <rect x="4" y="4" width="842" height="322" rx="12" fill="url(#bgGrad)" />

  <!-- Top macOS Bar -->
  <path d="M 4 16 C 4 9.37 9.37 4 16 4 L 834 4 C 840.63 4 846 9.37 846 16 L 846 44 L 4 44 Z" fill="url(#headGrad)" />
  <line x1="4" y1="44" x2="846" y2="44" stroke="#1e293b" stroke-width="1" />

  <!-- Window Dots (macOS style) -->
  <circle cx="28" cy="24" r="6" fill="#ff5f56" />
  <circle cx="48" cy="24" r="6" fill="#ffbd2e" />
  <circle cx="68" cy="24" r="6" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="425" y="28" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12px" font-weight="600" text-anchor="middle">
    ⚡ yahia@neural-core: ~/projects/applied-ai (zsh)
  </text>

  <!-- ================= TERMINAL TEXT LINES (EXPLICIT Y-COORDINATES) ================= -->
  
  <!-- LINE 1: Y = 90 -->
  <text x="35" y="90" class="code line1">
    <tspan fill="#38bdf8" font-weight="bold">❯ </tspan>
    <tspan fill="#c084fc" font-weight="bold">initialize </tspan>
    <tspan fill="#38bdf8">--identity </tspan>
    <tspan fill="#f1f5f9">"Yahia Bin Zaman" </tspan>
    <tspan fill="#4ade80">--mode=production</tspan>
  </text>

  <!-- LINE 2: Y = 135 -->
  <text x="35" y="135" class="code line2">
    <tspan fill="#64748b">[SYSTEM]: </tspan>
    <tspan fill="#38bdf8" font-weight="bold">Applied AI &amp; Full-Stack Software Engineer</tspan>
  </text>

  <!-- LINE 3: Y = 180 -->
  <text x="35" y="180" class="code line3">
    <tspan fill="#64748b">[MODULES]: </tspan>
    <tspan fill="#4ade80">✔ </tspan><tspan fill="#f8fafc">Autonomous AI Agents  </tspan>
    <tspan fill="#4ade80">✔ </tspan><tspan fill="#f8fafc">Next.js / Full-Stack  </tspan>
    <tspan fill="#4ade80">✔ </tspan><tspan fill="#f8fafc">Creative UI/UX</tspan>
  </text>

  <!-- LINE 4: Y = 225 -->
  <text x="35" y="225" class="code line4">
    <tspan fill="#64748b">[STATUS]: </tspan>
    <tspan fill="#34d399" font-weight="bold">● OPEN FOR ROLES &amp; CLIENT PROJECTS </tspan>
    <tspan fill="#818cf8">| Latency: 12ms </tspan>
    <tspan fill="#f43f5e">| Accuracy: 100%</tspan>
  </text>

  <!-- LINE 5: Y = 270 -->
  <text x="35" y="270" class="code line5">
    <tspan fill="#38bdf8" font-weight="bold">❯ </tspan>
    <tspan fill="#f1f5f9">crafting_next_generation_ai_products</tspan>
  </text>

  <!-- Blinking Cursor Box -->
  <rect x="425" y="255" width="9" height="17" fill="#38bdf8" class="cursor-blink line5" />

  <!-- Accent Bottom Dots -->
  <circle cx="810" cy="300" r="3" fill="#38bdf8" opacity="0.6"/>
  <circle cx="795" cy="300" r="3" fill="#818cf8" opacity="0.4"/>
  <circle cx="780" cy="300" r="3" fill="#c084fc" opacity="0.3"/>
</svg>
